<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>比喻小診探 🔍</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
    .card { background: white; border-radius: 20px; padding: 24px; max-width: 480px; margin: 20px auto; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    h1 { color: #2c3e50; font-size: 26px; margin-bottom: 20px; }
    .btn { display: block; width: 100%; padding: 18px; margin: 12px 0; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; box-sizing: border-box; }
    .btn-blue { background: #3498db; color: white; }
    .btn-green { background: #2ecc71; color: white; }
    .btn-purple { background: #9b59b6; color: white; }
    .btn-gray { background: #e0e0e0; color: #333; }
    .result { font-size: 22px; font-weight: bold; padding: 20px; border-radius: 14px; margin-top: 20px; line-height: 1.5; }
    .result-jie { background: #fff3cd; color: #856404; }
    .result-ming { background: #d4edda; color: #155724; }
    .result-an { background: #d1ecf1; color: #0c5460; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔍 比喻小診探</h1>
    
    <!-- 第 1 步 -->
    <div id="step1">
      <h2 style="color: #495057;">【第 1 步】尋找本體</h2>
      <p style="font-size: 18px; color: #6c757d;">句中有沒有出現<b>「本體」</b>（主角）？</p>
      <button class="btn btn-purple" onclick="goToJie()">❌ 沒有出現本體（主角隱形）</button>
      <button class="btn btn-blue" onclick="goToStep2()">✅ 有出現本體</button>
    </div>

    <!-- 第 2 步 -->
    <div id="step2" class="hidden">
      <h2 style="color: #495057;">【第 2 步】辨識喻詞</h2>
      <p style="font-size: 18px; color: #6c757d;">句子的<b>「喻詞」</b>（橋樑）是什麼？</p>
      <button class="btn btn-green" onclick="showResult('ming')">👉 像 / 彷彿 / 宛如 / 如</button>
      <button class="btn btn-blue" onclick="showResult('an')">👉 是 / 成了 / 變成</button>
      <button class="btn btn-gray" onclick="reset()">⬅️ 回上一頁</button>
    </div>

    <!-- 診斷結果 -->
    <div id="res-jie" class="result result-jie hidden">
      🎯 診斷結果：【 借 喻 】<br>
      <span style="font-size: 16px; font-weight: normal;"><br>主角（本體）隱形了，直接借用配角（喻體）登場！</span>
    </div>

    <div id="res-ming" class="result result-ming hidden">
      🎯 診斷結果：【 明 喻 】<br>
      <span style="font-size: 16px; font-weight: normal;"><br>三要素都在，看見了「像」字！</span>
    </div>

    <div id="res-an" class="result result-an hidden">
      🎯 診斷結果：【 暗 喻 】<br>
      <span style="font-size: 16px; font-weight: normal;"><br>三要素都在，看見了「是」字！</span>
    </div>

    <button id="reset-btn" class="btn btn-gray hidden" onclick="reset()" style="margin-top: 24px;">🔄 診斷下一題</button>
  </div>

  <script>
    function goToStep2() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }
    function goToJie() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('res-jie').classList.remove('hidden');
      document.getElementById('reset-btn').classList.remove('hidden');
    }
    function showResult(type) {
      document.getElementById('step2').classList.add('hidden');
      if(type === 'ming') document.getElementById('res-ming').classList.remove('hidden');
      if(type === 'an') document.getElementById('res-an').classList.remove('hidden');
      document.getElementById('reset-btn').classList.remove('hidden');
    }
    function reset() {
      document.getElementById('step1').classList.remove('hidden');
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('res-jie').classList.add('hidden');
      document.getElementById('res-ming').classList.add('hidden');
      document.getElementById('res-an').classList.add('hidden');
      document.getElementById('reset-btn').classList.add('hidden');
    }
  </script>
</body>
</html>
